[package]
name = "igw-plcsim-s7plus"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std"] }

[profile.release]
panic = "abort"
lto = "thin"
strip = "symbols"

[lints.rust]
linker_messages = "allow"
